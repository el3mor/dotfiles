general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/.cache/current_wallpaper_blur.png

    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.2
    brightness = 0.8
    vibrancy = 0.25
}

input-field {
    monitor =
    size = 320, 60
    position = 0, -140

    outline_thickness = 2

    dots_center = true
    dots_rounding = -1
    dots_spacing = 0.25

    fade_on_empty = false
    placeholder_text = Password...

    outer_color = rgb(7aa2f7)
    inner_color = rgba(20,20,20,0.65)
    font_color = rgb(cdd6f4)

    rounding = 12

    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(cdd6f4)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(a6adc8)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(9399b2)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -210
    halign = center
    valign = center
}
